name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint the web app
        run: pnpm --filter @timedesk/web lint
      - name: Tests (API on in-memory Postgres, shared logic, desktop logic)
        run: pnpm test
      - name: Build the web app
        run: pnpm --filter @timedesk/web build
