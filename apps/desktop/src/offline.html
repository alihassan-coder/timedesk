<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>timedesk</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { opacity: .75; line-height: 1.5; margin: 0 0 1.25rem; }
      code { font-size: .85em; opacity: .9; word-break: break-all; }
      button { font: inherit; padding: .55rem 1.2rem; border-radius: .5rem; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach timedesk</h1>
      <p>Check your internet connection, then try again. Your data is safe on the server.<br /><br /><code id="addr"></code></p>
      <button id="retry" autofocus>Try again</button>
    </main>
    <script>
      document.getElementById('addr').textContent = new URLSearchParams(location.search).get('url') || ''
      document.getElementById('retry').addEventListener('click', () => window.timedeskOffline.retry())
    </script>
  </body>
</html>
