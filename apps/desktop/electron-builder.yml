appId: com.timedesk.app
productName: timedesk
copyright: Copyright (c) timedesk
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/active-win/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  icon: build/icon.png
  category: Office
  maintainer: timedesk <alihassan.4dev@gmail.com>
  synopsis: Time tracking and todos
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
publish:
  provider: github
  owner: alihassan-coder
  repo: timedesk
